<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NeuraTrack — History &amp; Trends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --canvas:#F7F4EE; --canvas-dim:#EDE8DE; --paper:#FFFFFF;
    --ink:#1B2420; --ink-soft:#55504A;
    --green:#2F5D50; --green-dim:#7FB3A3; --green-tint:#E7F0EC;
    --terra:#D97B4F; --gold:#C9A227; --hair:#DAD2C2;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--canvas); color:var(--ink); font-family:'Inter',sans-serif; }
  h1,h2{ font-family:'Fraunces',serif; font-style:italic; font-weight:600; margin:0; }
  .mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:.04em; text-transform:uppercase; font-size:12px; color:var(--ink-soft); }

  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-bottom:1px solid var(--hair); background:var(--paper); position:sticky; top:0; z-index:10; }
  .wordmark{ font-family:'Fraunces'; font-style:italic; font-weight:600; font-size:20px; }
  .wordmark span{ color:var(--green); }
  nav.tabs{ display:flex; gap:28px; }
  nav.tabs a{ text-decoration:none; color:var(--ink-soft); font-weight:600; font-size:14px; padding:6px 0; border-bottom:2px solid transparent; }
  nav.tabs a.active{ color:var(--ink); border-color:var(--terra); }

  .wrap{ max-width:1200px; margin:0 auto; padding:28px 32px 80px; }
  .head-row{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; flex-wrap:wrap; gap:16px; }
  .head-row h1{ font-size:32px; }
  .actions{ display:flex; gap:10px; }
  .btn{ display:inline-flex; align-items:center; gap:8px; border-radius:4px; padding:10px 18px; font-family:'Inter'; font-weight:600; font-size:13.5px; cursor:pointer; border:1.5px solid var(--ink); background:transparent; color:var(--ink); min-height:40px; }
  .btn.primary{ background:var(--green); border-color:var(--green); color:var(--canvas); }

  .filters{ display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
  .chip-filter{ border:1px solid var(--hair); border-radius:999px; padding:8px 16px; font-size:13px; font-family:'IBM Plex Mono'; color:var(--ink-soft); cursor:pointer; background:var(--paper); }
  .chip-filter.active{ border-color:var(--green); color:var(--green); background:var(--green-tint); }

  .chart-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
  @media (max-width:900px){ .chart-row{ grid-template-columns:1fr; } }
  .card{ background:var(--paper); border:1px solid var(--hair); border-radius:12px; padding:22px; }
  .card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .card-head h3{ font-family:'Inter'; font-style:normal; font-weight:700; font-size:15px; }
  .badge{ font-family:'IBM Plex Mono'; font-size:11.5px; padding:4px 10px; border-radius:999px; background:var(--green-tint); color:var(--green); }
  .badge.down{ background:#FBEFE7; color:var(--terra); }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-family:'IBM Plex Mono'; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:10px 12px; border-bottom:1px solid var(--hair); }
  td{ padding:12px; border-bottom:1px solid var(--canvas-dim); }
  tr:hover td{ background:var(--canvas-dim); }
  .task-pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-family:'IBM Plex Mono'; background:var(--green-tint); color:var(--green); }
</style>
</head>
<body>

<header class="topbar">
  <div class="wordmark">Neura<span>Track</span></div>
  <nav class="tabs">
    <a href="capture.html">New Task</a>
    <a href="#" class="active">History</a>
    <a href="#">Settings</a>
  </nav>
</header>

<div class="wrap">
  <div class="head-row">
    <div>
      <span class="mono">Diane K. · local profile</span>
      <h1>Your trends</h1>
    </div>
    <div class="actions">
      <button class="btn">Export CSV</button>
      <button class="btn primary">Export PDF report</button>
    </div>
  </div>

  <div class="filters">
    <div class="chip-filter active">All tasks</div>
    <div class="chip-filter">Rest Tremor</div>
    <div class="chip-filter">Postural</div>
    <div class="chip-filter">Finger Tap</div>
    <div class="chip-filter">Pronation</div>
    <div class="chip-filter" style="margin-left:auto;">Last 8 weeks</div>
  </div>

  <div class="chart-row">
    <div class="card">
      <div class="card-head"><h3>Frequency over time</h3><span class="badge down">-4% / wk</span></div>
      <canvas id="freqChart" height="130"></canvas>
    </div>
    <div class="card">
      <div class="card-head"><h3>Amplitude over time</h3><span class="badge">+1% / wk</span></div>
      <canvas id="ampChart" height="130"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Session history</h3><span class="mono">14 sessions</span></div>
    <table>
      <thead><tr><th>Date</th><th>Task</th><th>Frequency</th><th>Amplitude</th><th>Notes</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<script>
  const labels = Array.from({length:10}, (_,i)=>`Wk ${i+1}`);
  const freqData = [5.6,5.5,5.4,5.3,5.1,5.0,4.9,4.8,4.7,4.6];
  const ampData  = [.011,.0115,.0112,.0118,.0120,.0117,.0121,.0119,.0123,.0122];

  new Chart(document.getElementById('freqChart'), {
    type:'line',
    data:{ labels, datasets:[{ data:freqData, borderColor:'#2F5D50', backgroundColor:'rgba(47,93,80,.08)', fill:true, tension:.35, pointRadius:3, pointBackgroundColor:'#2F5D50' }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ title:{display:true,text:'Hz'}, grid:{color:'#DAD2C2'} }, x:{ grid:{display:false} } } }
  });
  new Chart(document.getElementById('ampChart'), {
    type:'line',
    data:{ labels, datasets:[{ data:ampData, borderColor:'#D97B4F', backgroundColor:'rgba(217,123,79,.08)', fill:true, tension:.35, pointRadius:3, pointBackgroundColor:'#D97B4F' }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ title:{display:true,text:'RMS'}, grid:{color:'#DAD2C2'} }, x:{ grid:{display:false} } } }
  });

  const rows = [
    ["Jul 10, 2026","Rest Tremor","4.6 Hz","0.0122","—"],
    ["Jul 8, 2026","Finger Tap","—","—","decrement 22%"],
    ["Jul 6, 2026","Postural","6.9 Hz","0.0098","—"],
    ["Jul 3, 2026","Rest Tremor","4.7 Hz","0.0119","—"],
    ["Jun 29, 2026","Pronation","3.2 Hz","0.0087","—"],
    ["Jun 27, 2026","Rest Tremor","4.8 Hz","0.0123","—"],
  ];
  const body = document.getElementById('historyBody');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r[0]}</td><td><span class="task-pill">${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td>`;
    body.appendChild(tr);
  });

  document.querySelectorAll('.chip-filter').forEach(el => el.addEventListener('click', () => {
    document.querySelectorAll('.chip-filter').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
  }));
</script>
</body>
</html>
